[project]
name = "cmn-c1-113"
version = "1.1.0"
description = "VoiceActivatedFAQAgent — AgentCore Template (Cat 1, CMN)"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[marketplace,openai,platform-rag,platform-memory,platform-db,platform-storage-azure]==1.0.3",
    "langdetect==1.0.9",
    # python-multipart: required by FastAPI/Starlette to parse multipart/form-data
    # for the POST /invoke/audio upload endpoint.
    "python-multipart==0.0.20",
    # pyyaml: real runtime dependency — tests/proof_of_boundary/test_pb7_hitl_interrupt_propagation.py
    # reads config/config.yaml to check hitl.enabled.
    "pyyaml==6.0.1",
    # voxcpm2: local OSS TTS library (OpenBMB VoxCPM2).
    # Not published on PyPI — install from local path or internal registry.
    # CI install is skipped; TTSNode guards with VOXCPM2_AVAILABLE flag.
]

[project.optional-dependencies]
voice = [
    "numba==0.61.2",
    "openai-whisper==20250625",
]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The published agenticstar-agentcore wheel ships no py.typed marker / stubs
# for framework.*/shared.* — ignore_missing_imports below makes every
# framework/shared symbol resolve to Any, which strict's
# disallow_subclassing_any would otherwise reject for every node/graph class
# in this template (FunctionNode, AgentBaseGraph, AgentState are all
# framework.* base classes). Disabled fleet-wide rather than per-class: it is
# a consequence of the SDK's own missing stubs, not a signal about this
# template's code quality.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*", "openai_whisper", "whisper", "langdetect", "voxcpm2", "voxcpm2.*"]
ignore_missing_imports = true
